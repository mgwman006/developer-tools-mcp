spring:
  application:
    name: dockermodel
  ai:
    model:
      chat: openai
    openai:
      chat:
        model: ai/llama3.2
        base-url: http://localhost:12434/engines/v1
      api-key: dummy-key
    mcp:
      client:
        streamable-http:
          connections:
            tante:
              url: http://localhost:8083
              endpoint: /mcp
        stdio:
          servers-configuration: classpath:mcp/servers/mcp-servers-configuration.json
      server:
        protocol: streamable


server:
  port: 8083
